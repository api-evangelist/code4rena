name: Code4rena
description: 'Code4rena (C4) is a competitive smart-contract security auditing platform
  that connects Web3/DeFi projects (sponsors) with a global community of security researchers
  (wardens) through time-boxed competitive audits and ongoing bug bounties. Sponsors
  fund an audit, wardens compete to surface vulnerabilities, and judges rate severity,
  validity, and quality to distribute awards via a ranked-curve incentive model. Over
  five years the platform ran 512+ audits, engaged 16,600+ researchers, and surfaced
  26,898 findings including 1,607 high-severity vulnerabilities. Code4rena announced
  it is winding down operations, seeing active competitions and bounties through to
  completion. This API Evangelist profile was surfaced as a paradigm portfolio company;
  the platform is web/app-based with GitBook documentation and does not publish a public
  REST/GraphQL API, SDK, or developer portal.'
